<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Default Readings</title>
   
    <script src="./style.js"></script>
</head>
<body class="bg-blue-600 p-10 flex justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">Set Initial Readings</h1>
        
        <div class="space-y-4">
            <h3 class="font-bold border-b pb-2">Petrol (Initial)</h3>
            <input type="number" id="p1" placeholder="Nozzle 1" class="w-full p-2 border rounded">
            <input type="number" id="p2" placeholder="Nozzle 2" class="w-full p-2 border rounded">
            <input type="number" id="p3" placeholder="Nozzle 3" class="w-full p-2 border rounded">

            <h3 class="font-bold border-b pb-2 mt-4">Diesel (Initial)</h3>
            <input type="number" id="d1" placeholder="Nozzle 1" class="w-full p-2 border rounded">
            <input type="number" id="d2" placeholder="Nozzle 2" class="w-full p-2 border rounded">
            <input type="number" id="d3" placeholder="Nozzle 3" class="w-full p-2 border rounded">

            <button onclick="updateDefaults()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold mt-6">
                Update Defaults
            </button>
        </div>
    </div>

    <script>
        async function updateDefaults() {
            const body = {
                p1: document.getElementById('p1').value,
                p2: document.getElementById('p2').value,
                p3: document.getElementById('p3').value,
                d1: document.getElementById('d1').value,
                d2: document.getElementById('d2').value,
                d3: document.getElementById('d3').value
            };

            const res = await fetch('/api/defaults/update', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });

            if(res.ok) alert('Defaults updated! Next entry will use these.');
        }

        // Load existing on load
        window.onload = async () => {
            const res = await fetch('/api/defaults');
            const data = await res.json();
            document.getElementById('p1').value = data.p1;
            document.getElementById('p2').value = data.p2;
            document.getElementById('p3').value = data.p3;
            document.getElementById('d1').value = data.d1;
            document.getElementById('d2').value = data.d2;
            document.getElementById('d3').value = data.d3;
        }
    </script>
</body>
</html>
